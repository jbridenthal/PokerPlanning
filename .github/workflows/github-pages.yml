name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '7.0.x'

    - name: Publish Blazor WebAssembly
      run: dotnet publish --configuration Release --output release

    - name: Add .nojekyll file
      run: touch release/wwwroot/.nojekyll

    # Fixes the SPA routing 404 issue on page refresh
    - name: Create 404 page for SPA routing
      run: cp release/wwwroot/index.html release/wwwroot/404.html

    # Official GitHub Action to configure Pages
    - name: Setup Pages
      uses: actions/configure-pages@v4

    # Official GitHub Action to package the artifacts
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'release/wwwroot'

    # Official GitHub Action to deploy the artifact
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
